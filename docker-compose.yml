#
# docker-compose.yml — build, test, fuzz, and triage the mxml harness.
#
# Full pipeline (build + test + baseline + agentic loop + triage):
#   docker compose up
#
# Build only:
#   docker compose run --rm harness make -C harness all
#
# Run sample tests:
#   docker compose run --rm harness make -C harness test
#
# Run baseline strategy:
#   docker compose run --rm harness python3 -m fuzzer.baseline_strategy
#
# Run agentic loop only:
#   docker compose run --rm harness python3 -m agent.orchestrator --max-iterations 5 --num-examples 200
#
# Run triage only (after a loop run):
#   docker compose run --rm harness python3 -m triage.run
#
# Clean build artifacts:
#   docker compose run --rm harness make -C harness clean
#

services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/src
    working_dir: /src
    environment:
      - PYTHONPATH=/src
    command: >
      sh -c "
        set -e
        echo '=== Building harness ==='
        make -C /src/harness all
        echo '=== Running sample tests ==='
        make -C /src/harness test
        echo '=== Running wrapper tests ==='
        make -C /src/harness test-wrapper
        echo '=== Running baseline strategy ==='
        python3 -m fuzzer.baseline_strategy
        echo ''
        echo '=== Agentic loop (seed, 5 iters, 200 ex) ==='
        python3 -m agent.orchestrator --max-iterations 5 --num-examples 200
        echo ''
        echo '=== Crash triage ==='
        python3 -m triage.run
      "
