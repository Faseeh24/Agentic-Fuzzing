#
# docker-compose.yml — build and test the mxml harness with ASan + UBSan.
#
# Build + run sample tests:
#   docker compose up
#
# Build only:
#   docker compose run --rm harness make -C harness all
#
# Run tests only:
#   docker compose run --rm harness make -C harness test
#
# Clean build artifacts:
#   docker compose run --rm harness make -C harness clean
#

services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/src
    working_dir: /src
    command: ["make", "-C", "harness", "all", "test"]
