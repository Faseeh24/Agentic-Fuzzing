#
# docker-compose.yml — build, test, fuzz, and triage the mxml harness.
#
# Build + run sample tests + baseline + agentic loop + triage:
#   docker compose up
#
# Build only:
#   docker compose run --rm harness make -C harness all
#
# Run tests only:
#   docker compose run --rm harness make -C harness test
#
# Run baseline strategy:
#   docker compose run --rm harness python3 -m fuzzer.baseline_strategy
#
# Run agentic loop only:
#   docker compose run --rm harness python3 -m fuzzer.agentic_loop
#
# Run triage only (after a loop run):
#   docker compose run --rm harness python3 -m triage.run
#
# Clean build artifacts:
#   docker compose run --rm harness make -C harness clean
#

services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/src
    working_dir: /src
    command: ["sh", "-c", "make -C /src/harness all test && make -C /src/harness test-wrapper && PYTHONPATH=/src python3 -m fuzzer.baseline_strategy && echo '' && echo '=== Agentic loop (seed, 5 iters, 200 ex) ===' && PYTHONPATH=/src python3 -m fuzzer.agentic_loop --max-iterations 5 --num-examples 200 && echo '' && echo '=== Crash triage ===' && PYTHONPATH=/src python3 -m triage.run || echo '(agentic loop / triage skipped: set API keys in .env to enable)']"]
